<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Impulse-X — Equipo de cohetería. Lanzamientos por venir." />
    <title>Impulse-X</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="launch-page">
      <div class="stars" aria-hidden="true"></div>
      <div class="orbital orbital--one" aria-hidden="true"></div>
      <div class="orbital orbital--two" aria-hidden="true"></div>
      <div class="glow" aria-hidden="true"></div>

      <header class="site-header">
        <a class="brand" href="#inicio" aria-label="Impulse-X, inicio">
          <span class="brand__mark"></span>
          <span>IMPULSE-<b>X</b></span>
        </a>
        <span class="mission-status"><i></i> SISTEMA EN PREPARACIÓN</span>
      </header>

      <section class="hero" id="inicio" aria-labelledby="hero-title">
        <div class="hero__copy">
          <p class="eyebrow">EQUIPO DE COHETERÍA · ROCKET TEC</p>
          <h1 id="hero-title">Lanzamientos<br /><em>por venir</em></h1>
          <p class="intro">Estamos preparando la siguiente trayectoria. Pronto compartiremos el avance, los resultados y la historia detrás de cada misión.</p>
          <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>
          <p class="coordinate">IMPULSE-X / MISSION CONTROL</p>
        </div>

        <div class="hero__visual" aria-hidden="true">
          <div class="target-ring target-ring--outer"></div>
          <div class="target-ring target-ring--inner"></div>
          <div class="rocket-line"></div>
          <img class="logo" src="assets/impulse-x-logo.png" alt="" />
        </div>
      </section>

      <footer class="site-footer">
        <span>ROCKET TEC</span>
        <span class="footer-rule"></span>
        <span>IMPULSE-X · 2026</span>
      </footer>
    </main>
  </body>
</html>
